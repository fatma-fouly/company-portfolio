name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Test FTP secrets
        run: |
          echo "Host: ${{ secrets.FTP_HOST }}"
          echo "Username: ${{ secrets.FTP_USERNAME }}"
          echo "Password length: ${#${{ secrets.FTP_PASSWORD }}}"

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build project
        run: |
          npm install
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SECRET1  }}
          username: ${{ secrets.SECRET2 }}
          password: ${{ secrets.SECRET3 }}
          protocol: ftp
          local-dir: ./build/
          server-dir: public_html
